<style>
:root{
  --red:#D71D1A; --red-dk:#A81613; --ink:#0D0D0D; --ink-2:#2A2A2A;
  --cream:#FBF7F1; --card:#FFFFFF; --line:#E6DFD5; --line-2:#D8CFC2;
  --muted:#6B6259; --teal:#4A8A75; --amber:#C08A2E;
  --shadow:0 1px 2px rgba(13,13,13,.05),0 8px 24px rgba(13,13,13,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}

/* header */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
.brand{display:flex;align-items:baseline;gap:12px}
.mark{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.mark .a{color:var(--ink)} .mark .b{color:var(--red)}
.brand .sep{width:1px;height:26px;background:var(--line-2)}
.brand .ctx{font-size:13px;color:var(--muted);font-weight:500}
.brand .ctx strong{display:block;color:var(--ink);font-size:15px;font-weight:700}
.hdr .meta{text-align:right;font-size:12px;color:var(--muted);line-height:1.6}
.hdr .meta strong{color:var(--ink)}

/* tabs */
nav.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:73px;z-index:49}
.tabrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;font:inherit;font-weight:600;font-size:14px;color:var(--muted);
  padding:14px 18px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.tab .cnt{display:inline-block;margin-left:7px;font-size:11px;font-weight:700;background:var(--cream);
  border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
.tab[aria-selected="true"] .cnt{background:#FDECEC;border-color:#F5C9C8;color:var(--red-dk)}

main{padding:28px 0 64px}
.panel[hidden]{display:none}
.lede{font-size:14px;color:var(--muted);margin:0 0 20px;max-width:760px}
h2.sec{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:32px 0 12px}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.stat .s{font-size:12px;color:var(--muted);margin-top:5px}
.v.red{color:var(--red)} .v.teal{color:var(--teal)} .v.amber{color:var(--amber)}

/* entity cards */
.ents{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ent{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);
  cursor:pointer;transition:.15s;text-align:left;font:inherit;width:100%}
.ent:hover{border-color:var(--red);transform:translateY(-2px)}
.ent h3{margin:0;font-size:17px;font-weight:700}
.ent .p{font-size:12px;color:var(--muted);margin-top:4px}
.ent .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ent .grid div{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.ent .grid b{display:block;font-size:17px;color:var(--ink);letter-spacing:-.01em;margin-top:3px}
.ent .go{margin-top:14px;font-size:12px;font-weight:700;color:var(--red)}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 14px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 14px 11px 36px;border:1px solid var(--line-2);border-radius:9px;
  font:inherit;font-size:14px;background:var(--card);color:var(--ink)}
.search input:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45}
select{padding:11px 12px;border:1px solid var(--line-2);border-radius:9px;font:inherit;font-size:13px;background:var(--card);color:var(--ink);cursor:pointer}

/* table */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
thead th{background:#F7F2EA;text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
thead th.num,td.num{text-align:right}
thead th.ctr,td.ctr{text-align:center}
tbody tr{border-bottom:1px solid #F0EAE1;cursor:pointer;transition:background .12s}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:#FDF9F4}
td{padding:12px 14px;vertical-align:middle}
td .t{font-weight:600}
td .b{font-size:11px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;white-space:nowrap}
.bg-ok{background:#EAF3EF;color:var(--teal)}
.bg-lo{background:#FDECEC;color:var(--red-dk)}
.bg-hi{background:#FBF1DF;color:var(--amber)}
.mono{font-variant-numeric:tabular-nums}

/* range bar */
.rb{position:relative;height:8px;background:#EFE8DE;border-radius:999px;min-width:120px}
.rb .fill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#F3D9D8,#E9B0AE);border-radius:999px}
.rb .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.55}
.rb .dot{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);
  border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.28)}

/* drawer */
.ovl{position:fixed;inset:0;background:rgba(13,13,13,.42);backdrop-filter:blur(2px);z-index:100;opacity:0;pointer-events:none;transition:.2s}
.ovl.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--cream);z-index:101;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);overflow-y:auto;box-shadow:-8px 0 40px rgba(0,0,0,.16)}
.drawer.on{transform:none}
.dhd{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:20px 24px;display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
.dhd h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.dhd .sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}
.x{appearance:none;border:1px solid var(--line-2);background:var(--card);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:17px;color:var(--muted);flex:none}
.x:hover{border-color:var(--red);color:var(--red)}
.dbody{padding:22px 24px 48px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
.kv .c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kv .c .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv .c .v{font-size:20px;font-weight:800;margin-top:5px;letter-spacing:-.01em}
.mt{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px;margin-bottom:8px}
.mt th{background:#F7F2EA;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:9px 12px;text-align:right;font-weight:700}
.mt th:first-child{text-align:left}
.mt td{padding:10px 12px;text-align:right;border-top:1px solid #F0EAE1;font-variant-numeric:tabular-nums}
.mt td:first-child{text-align:left;font-weight:600}
.mt tr.hl td{background:#FDF6EE;font-weight:700}
.note{font-size:12px;color:var(--muted);background:#FDF6EE;border:1px solid #F0E2CE;border-radius:9px;padding:11px 13px;margin-bottom:18px}
.viz{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:22px}
.viz .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:9px}

/* distribution */
.dist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.drow{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.drow:last-child{margin-bottom:0}
.drow .nm{width:152px;font-size:12px;font-weight:600;flex:none}
.drow .track{flex:1;height:22px;background:#F4EEE5;border-radius:6px;overflow:hidden}
.drow .bar{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;
  color:#fff;font-size:11px;font-weight:700;min-width:26px;transition:width .5s ease}
.drow .ct{width:42px;text-align:right;font-size:12px;font-weight:700;color:var(--muted);flex:none}

footer{border-top:1px solid var(--line);background:var(--card);padding:26px 0;margin-top:20px}
.ft{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.ft .m{font-weight:800;font-size:16px}
.empty{padding:44px;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:720px){
  .hdr{flex-direction:column;align-items:flex-start;gap:10px}
  .hdr .meta{text-align:left}
  nav.tabs{top:auto;position:static}
  .kv{grid-template-columns:1fr}
  .drow .nm{width:104px;font-size:11px}
}

function agg(rs){
  const cur = rs.reduce((a,r)=>a+r.cur,0), mid = rs.reduce((a,r)=>a+r.l[1],0);
  return { n:rs.length, cur, mid, gap:mid-cur, port:cur/mid,
    lo:rs.filter(r=>r.compa<0.90).length, hi:rs.filter(r=>r.compa>1.10).length,
    ok:rs.filter(r=>r.compa>=0.90&&r.compa<=1.10).length,
    belowMid:rs.filter(r=>r.compa<1).length };
}

function distRows(rs){
  const buckets = [
    ['Below Market (<0.90)', rs.filter(r=>r.compa<0.90).length, '#D71D1A'],
    ['0.90 – 0.95', rs.filter(r=>r.compa>=0.90&&r.compa<0.95).length, '#E08A87'],
    ['0.95 – 1.00', rs.filter(r=>r.compa>=0.95&&r.compa<1.00).length, '#8FB9A9'],
    ['1.00 – 1.05', rs.filter(r=>r.compa>=1.00&&r.compa<1.05).length, '#4A8A75'],
    ['1.05 – 1.10', rs.filter(r=>r.compa>=1.05&&r.compa<=1.10).length, '#3C7160'],
    ['Above Market (>1.10)', rs.filter(r=>r.compa>1.10).length, '#C08A2E']
  ];
  const max = Math.max(...buckets.map(b=>b[1]), 1);
  return buckets.map(b=>`<div class="drow"><div class="nm">${b[0]}</div>
    <div class="track"><div class="bar" style="width:${b[1]/max*100}%;background:${b[2]}">${b[1]?b[1]:''}</div></div>
    <div class="ct">${(b[1]/rs.length*100).toFixed(0)}%</div></div>`).join('');
}

function tableBlock(key, rs, showEntity){
  const id = cssId(key);
  return `<div class="tools">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q-${id}" placeholder="Search roles, benchmarks, or job codes…">
    </div>
    ${showEntity?`<select id="e-${id}"><option value="">All entities</option>${ENTS.map(e=>`<option>${e}</option>`).join('')}</select>`:''}
    <select id="f-${id}">
      <option value="">All market positions</option>
      <option value="lo">Below market</option>
      <option value="ok">Market competitive</option>
      <option value="hi">Above market</option>
    </select>
  </div>
  <div class="tablewrap"><div class="scroll"><table>
    <thead><tr>
      <th data-s="title">Role</th>
      ${showEntity?'<th data-s="entity">Entity</th>':''}
      <th data-s="loc">Market</th>
      <th class="num" data-s="cur">Current Base</th>
      <th class="num" data-s="mid">Midpoint</th>
      <th class="ctr">Range Position</th>
      <th class="num" data-s="compa">Compa</th>
      <th class="ctr" data-s="compa">Position</th>
    </tr></thead>
    <tbody id="tb-${id}"></tbody>
  </table></div></div>`;
}

function wireTable(key, rs, showEntity){
  const id = cssId(key);
  const tb = document.getElementById('tb-'+id);
  const q = document.getElementById('q-'+id);
  const f = document.getElementById('f-'+id);
  const esel = showEntity ? document.getElementById('e-'+id) : null;
  let sortKey = 'title', dir = 1;

  function val(r,k){ return k==='mid'?r.l[1] : k==='entity'?r.entity : r[k]; }

  function draw(){
    const term = q.value.trim().toLowerCase();
    const pos = f.value, ent = esel ? esel.value : '';
    let out = rs.filter(r=>{
      if(ent && r.entity!==ent) return false;
      if(pos==='lo'&&!(r.compa<0.90)) return false;
      if(pos==='hi'&&!(r.compa>1.10)) return false;
      if(pos==='ok'&&!(r.compa>=0.90&&r.compa<=1.10)) return false;
      if(!term) return true;
      return (r.title+' '+r.bench+' '+r.code+' '+r.loc).toLowerCase().includes(term);
    });
    out.sort((a,b)=>{
      const x=val(a,sortKey), y=val(b,sortKey);
      return (typeof x==='string' ? x.localeCompare(y) : x-y) * dir;
    });
    if(!out.length){ tb.innerHTML = `<tr><td colspan="9" class="empty">No roles match those filters.</td></tr>`; return; }
    tb.innerHTML = out.map(r=>{
      const [lo,mid,hi] = r.l;
      const span = hi-lo, padded = span*0.28;
      const min = lo-padded, max = hi+padded, W = max-min;
      const posPct = Math.max(0, Math.min(100, (r.cur-min)/W*100));
      return `<tr data-k="${r.entity}|${r.code}|${r.title.replace(/"/g,'&quot;')}">
        <td><div class="t">${r.title}</div><div class="b">${r.bench} · ${r.code}</div></td>
        ${showEntity?`<td><div class="b" style="font-weight:600;color:var(--ink)">${r.entity}</div></td>`:''}
        <td><div class="b" style="color:var(--ink)">${r.loc}</div></td>
        <td class="num mono">${money(r.cur)}</td>
        <td class="num mono">${money(mid)}</td>
        <td><div class="rb">
          <div class="fill" style="left:${(lo-min)/W*100}%;width:${span/W*100}%"></div>
          <div class="mid" style="left:${(mid-min)/W*100}%"></div>
          <div class="dot" style="left:${posPct}%;background:${bcol(r.compa)}"></div>
        </div></td>
        <td class="num mono" style="font-weight:700;color:${bcol(r.compa)}">${r.compa.toFixed(3)}</td>
        <td class="ctr"><span class="badge ${bcls(r.compa)}">${band(r.compa)}</span></td>
      </tr>`;
    }).join('');
  }

  q.addEventListener('input', draw);
  f.addEventListener('change', draw);
  if(esel) esel.addEventListener('change', draw);
  tb.closest('table').querySelectorAll('thead th[data-s]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.s;
      if(k===sortKey) dir = -dir; else { sortKey = k; dir = 1; }
      draw();
    });
  });
  tb.addEventListener('click', e=>{
    const tr = e.target.closest('tr[data-k]'); if(!tr) return;
    const [ent, code, title] = tr.dataset.k.split('|');
    const r = ALL.find(x=>x.entity===ent && x.code===code && x.title===title);
    if(r) openDrawer(r);
  });
  draw();
}

/* ---------- drawer ---------- */
const ovl = document.getElementById('ovl'), drawer = document.getElementById('drawer');
function closeDrawer(){ drawer.classList.remove('on'); ovl.classList.remove('on'); drawer.setAttribute('aria-hidden','true'); }
ovl.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

function openDrawer(r){
  const [lo,mid,hi] = r.l, [ulo,umid,uhi] = r.us;
  const span=hi-lo, pad=span*0.28, min=lo-pad, max=hi+pad, W=max-min;
  const posPct = Math.max(0,Math.min(100,(r.cur-min)/W*100));
  const bonusAmt = Math.round(mid*r.bonus);
  drawer.innerHTML = `
  <div class="dhd">
    <div>
      <h3>${r.title}</h3>
      <div class="sub">${r.bench} &nbsp;·&nbsp; ${r.code}<br>${r.entity} &nbsp;·&nbsp; ${r.loc} &nbsp;·&nbsp; Bonus target ${pct(r.bonus)}</div>
    </div>
    <button class="x" id="xbtn" aria-label="Close">✕</button>
  </div>
  <div class="dbody">
    ${r.note?`<div class="note">${r.note}</div>`:''}
    <div class="kv">
      <div class="c"><div class="k">Current Base</div><div class="v">${money(r.cur)}</div></div>
      <div class="c"><div class="k">Total Cash @ Midpoint</div><div class="v">${money(r.ote)}</div></div>
      <div class="c"><div class="k">Compa-Ratio</div><div class="v" style="color:${bcol(r.compa)}">${r.compa.toFixed(3)}</div></div>
      <div class="c"><div class="k">Market Position</div><div class="v" style="color:${bcol(r.compa)};font-size:15px">${band(r.compa)}</div></div>
    </div>

    <div class="viz">
      <div class="lbl"><span>${money(lo)}</span><span style="font-weight:700;color:var(--ink)">Midpoint ${money(mid)}</span><span>${money(hi)}</span></div>
      <div class="rb" style="height:11px">
        <div class="fill" style="left:${(lo-min)/W*100}%;width:${span/W*100}%"></div>
        <div class="mid" style="left:${(mid-min)/W*100}%"></div>
        <div class="dot" style="left:${posPct}%;background:${bcol(r.compa)};width:15px;height:15px"></div>
      </div>
      <div class="lbl" style="margin:9px 0 0"><span>25th percentile</span><span>Current base ${money(r.cur)}</span><span>75th percentile</span></div>
    </div>

    <h2 class="sec" style="margin-top:0">Market Compensation Ranges</h2>
    <table class="mt">
      <thead><tr><th>${r.loc}</th><th>25th</th><th>Midpoint</th><th>75th</th></tr></thead>
      <tbody>
        <tr class="hl"><td>Base salary</td><td>${money(lo)}</td><td>${money(mid)}</td><td>${money(hi)}</td></tr>
        <tr><td>Total cash @ ${pct(r.bonus)}</td><td>${money(lo*(1+r.bonus))}</td><td>${money(mid*(1+r.bonus))}</td><td>${money(hi*(1+r.bonus))}</td></tr>
      </tbody>
    </table>
    <table class="mt">
      <thead><tr><th>United States</th><th>25th</th><th>Midpoint</th><th>75th</th></tr></thead>
      <tbody>
        <tr><td>Base salary</td><td>${money(ulo)}</td><td>${money(umid)}</td><td>${money(uhi)}</td></tr>
        <tr><td>Total cash @ ${pct(r.bonus)}</td><td>${money(ulo*(1+r.bonus))}</td><td>${money(umid*(1+r.bonus))}</td><td>${money(uhi*(1+r.bonus))}</td></tr>
      </tbody>
    </table>

    <h2 class="sec">Annual Incentive</h2>
    <div class="note" style="background:var(--card);border-color:var(--line)">
      At the ${r.loc.split(',')[0]} midpoint, a ${pct(r.bonus)} target equals <strong>${money(bonusAmt)}</strong>,
      bringing total target cash to <strong>${money(r.ote)}</strong>.
      Local midpoint runs ${mid>=umid?'above':'below'} the national midpoint of ${money(umid)}
      (${((mid/umid-1)*100).toFixed(1)}% ${mid>=umid?'premium':'discount'}).
    </div>
  </div>`;
  document.getElementById('xbtn').addEventListener('click', closeDrawer);
  drawer.classList.add('on'); ovl.classList.add('on'); drawer.setAttribute('aria-hidden','false');
  drawer.scrollTop = 0;
}

renderOverview();
</script>
